site_name: ERML — Emotion Recognition ML
site_url: https://erml.sidlakhani.in
site_description: >-
  A pip-installable Python SDK for facial emotion recognition.
  Drop it into your project, pass it a frame, get back structured emotion data.
site_author: ERML Contributors
repo_url: https://github.com/sid-lakhani/erml
repo_name: sid-lakhani/erml
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/erml-logo.png
  favicon: assets/erml-icon.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - API Reference:
      - EmotionDetector: api/detector.md
      - Schemas: api/schemas.md
      - Downloader: api/download.md
      - Utilities: api/utils.md
  - Guides:
      - Training: guides/training.md
      - Contributing: guides/contributing.md
