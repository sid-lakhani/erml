[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erml"
version = "0.1.0"
description = "Facial emotion recognition SDK — drop-in library for emotion detection from images"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "ERML Contributors" }]
keywords = ["emotion", "recognition", "machine-learning", "face", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "tensorflow>=2.10",
    "opencv-python-headless>=4.6",
    "numpy>=1.23",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.urls]
Homepage = "https://github.com/sidlakhani/erml"
Repository = "https://github.com/sidlakhani/erml"

[tool.setuptools.packages.find]
where = ["."]
include = ["erml*"]

[tool.setuptools.package-data]
erml = ["assets/*.xml", "assets/*.h5"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.pytest.ini_options]
testpaths = ["tests"]
