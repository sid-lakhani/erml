[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erml"
version = "0.1.0"
description = "Facial emotion recognition SDK — drop-in library for emotion detection from images"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8.1"
authors = [{ name = "ERML Contributors" }]
keywords = ["emotion", "recognition", "machine-learning", "face", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python-headless>=4.6",
    "numpy>=1.23",
    "Pillow>=9.0",
    "pydantic>=2.0",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
train = [
    "tensorflow>=2.10",
    "scipy>=1.10",
]
export = [
    "tensorflow>=2.10",
    "tf2onnx>=1.16",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
    "pydantic>=2.0",
    "onnxruntime>=1.16",
]

[project.urls]
Homepage = "https://github.com/sid-lakhani/erml"
Repository = "https://github.com/sid-lakhani/erml"

[tool.hatch.build.targets.wheel]
packages = ["erml"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",  # whitespace before ':' — conflicts with Black slice formatting
    "W503",  # line break before binary operator — conflicts with Black
    "E402",  # module level import not at top — intentional for TF log suppression
]
exclude = [".venv", ".git", "__pycache__", "*.egg-info"]

[tool.pytest.ini_options]
testpaths = ["tests"]
